name: doanltdd
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0

  # State management
  provider: ^6.1.0

  # File & media
  image_picker: ^1.0.0
  file_picker: ^8.0.0          # MỚI: upload CV (PDF/Word)

  # Network & cache
  cached_network_image: ^3.3.0

  # Storage
  shared_preferences: ^2.2.0

  # URL launcher (mở CV trong browser)
  url_launcher: ^6.2.0         # MỚI: xem CV online

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true